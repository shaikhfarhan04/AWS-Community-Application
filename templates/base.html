<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS Community</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f4f5f7;color:#16191f}
  header{background:#232f3e;color:#fff;padding:16px 24px}
  header b{color:#ff9900}
  main{max-width:760px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border-radius:8px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  label{display:block;margin:14px 0 4px;font-weight:600;font-size:14px}
  input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;font:inherit}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  button{margin-top:20px;background:#ff9900;border:0;padding:11px 22px;border-radius:6px;font-weight:700;cursor:pointer}
  .flash{background:#fde8e8;border:1px solid #f5b5b5;padding:10px;border-radius:6px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
  small{color:#666} a{color:#0972d3}
  @media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head>
<body><header><b>AWS</b> Community</header>
<main>
{% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</main></body></html>
